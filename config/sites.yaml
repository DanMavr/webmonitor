sites:

  - name: "Petromatad - Full Site"
    url: "https://www.petromatadgroup.com"
    monitor_type: "text"
    mode: "whole_site"
    interval_minutes: 720
    crawl:
      use_sitemap: true
      max_pages: 100
      stay_on_domain: true
      exclude_patterns:
        - "/cdn-cgi/"
        - ".pdf"
        - ".jpg"
        - ".png"
    ignore_selectors:
      - ".stock-price"
      - ".stock-widget"
      - "#live-price"
      - ".ticker"
      - "header"
      - "footer"
      - ".cookie-notice"
    notify:
      - telegram

  - name: "Petromatad - Investor Page"
    url: "https://www.petromatadgroup.com/investors/stock-information/"
    monitor_type: "text"
    mode: "single_page"
    interval_minutes: 60
    watch_selectors:
      - "main"
    ignore_selectors:
      - ".live-price"
      - ".stock-chart"
      - ".price-ticker"
    notify:
      - telegram

  - name: "LSE - Petro Matad RNS"
    url: "https://www.londonstockexchange.com/stock/MATD/petro-matad-limited/analysis"
    monitor_type: "text"
    mode: "single_page"
    schedule_type: "time_window"
    timezone: "Europe/London"
    windows:
      - days: "mon-fri"
        from: "06:59"
        to: "07:10"
        interval_minutes: 1
      - days: "mon-fri"
        from: "07:10"
        to: "17:00"
        interval_minutes: 5
    ignore_selectors:
      - ".price"
      - ".stock-price"
      - ".bid"
      - ".offer"
      - ".change"
      - "header"
      - "footer"
      - "nav"
    notify:
      - telegram

  - name: "Envoi - Mongolia Projects"
    url: "https://envoi.co.uk/projects/active-projects/asia/mongolia/"
    monitor_type: "text"
    mode: "single_page"
    interval_minutes: 480
    ignore_selectors:
      - "header"
      - "footer"
      - "nav"
    notify:
      - telegram

  - name: "Mongolia Energy Ministry"
    url: "https://energy.gov.mn/home"
    monitor_type: "text"
    mode: "single_page"
    interval_minutes: 480
    ignore_selectors:
      - "header"
      - "footer"
      - "nav"
    notify:
      - telegram

  - name: "Sunsteppe - Full Site"
    url: "https://www.sunsteppe.com/"
    monitor_type: "text"
    mode: "whole_site"
    interval_minutes: 480
    crawl:
      use_sitemap: true
      max_pages: 50
      stay_on_domain: true
      exclude_patterns:
        - ".pdf"
        - ".jpg"
        - ".png"
    ignore_selectors:
      - "header"
      - "footer"
      - "nav"
    notify:
      - telegram

  - name: "EBRD - Projects RSS"
    url: "https://www.ebrd.com/rss/projects.xml"
    monitor_type: "text"
    mode: "single_page"
    interval_minutes: 480
    notify:
      - telegram

  - name: "EIB - Projects RSS"
    url: "https://www.eib.org/en/rss/projects/all.xml"
    monitor_type: "text"
    mode: "single_page"
    interval_minutes: 480
    notify:
      - telegram
