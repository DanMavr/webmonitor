# sites.yaml — WebMonitor configuration
#
# Each site needs only 4 things:
#   name, url, clip (set via dashboard), schedule_minutes
#
# mode: screenshot  (default) — uses Playwright + EasyOCR
# mode: json_api              — direct JSON field comparison (for APIs like LSE)
#
# clip: set this via the dashboard Add/Edit form (drag-to-select).
#       If omitted, the full page is monitored.

sites:

  # ── LSE RNS — keep as JSON API (runs every 1 min, no screenshot needed) ───
  - name: "LSE - RNS"
    url: "https://api.londonstockexchange.com/api/gw/lse/instruments/alldata/MATD"
    mode: json_api
    schedule_type: time_window
    timezone: Europe/London
    json_fields:
      - idnews
      - subjectnews
      - datelastnews
    windows:
      - days: mon-fri
        from: '06:55'
        to: '17:00'
        interval_minutes: 1
    notify: [telegram]

  # ── Screenshot sites — set clip via dashboard ─────────────────────────────
  - name: "Petromatad"
    url: "https://www.petromatadgroup.com/news"
    mode: screenshot
    clip: {x: 0, y: 200, width: 1280, height: 1200}   # ← update via dashboard
    ocr_languages: [en]
    js_wait: 3.0
    interval_minutes: 720
    notify: [telegram]

  - name: "Envoi"
    url: "https://envoi.co.uk/projects/active-projects/asia/mongolia/"
    mode: screenshot
    clip: {x: 0, y: 200, width: 1280, height: 1400}   # ← update via dashboard
    ocr_languages: [en]
    js_wait: 2.0
    interval_minutes: 360
    notify: [telegram]

  - name: "Mongolia Energy Ministry"
    url: "https://energy.gov.mn/home"
    mode: screenshot
    ssl_verify: false
    clip: {x: 0, y: 450, width: 1280, height: 900}    # ← skips rotating hero banner
    ocr_languages: [en, ru]                             # ru covers Mongolian Cyrillic
    js_wait: 3.0
    interval_minutes: 720
    notify: [telegram]

  - name: "Sunsteppe"
    url: "https://www.sunsteppe.com/news"
    mode: screenshot
    clip: {x: 0, y: 180, width: 1280, height: 1000}   # ← update via dashboard
    ocr_languages: [en]
    js_wait: 2.0
    interval_minutes: 720
    notify: [telegram]

  - name: "EBRD - Mongolia Energy"
    url: "https://www.ebrd.com/home/what-we-do/projects.html?1=1&filterCountry=Mongolia&filterSector=Energy#customtab-70eec7766a-item-4654c5d413-tab"
    mode: screenshot
    clip: {x: 80, y: 300, width: 1100, height: 800}   # ← update via dashboard
    ocr_languages: [en]
    js_wait: 5.0                                        # extra wait for tab to render
    interval_minutes: 720
    notify: [telegram]

  - name: "EIB - Mongolia"
    url: "https://www.eib.org/en/projects/loans/index.htm?q=mongolia&sortColumn=statusDate&sortDir=desc"
    mode: screenshot
    clip: {x: 0, y: 250, width: 1280, height: 900}    # ← update via dashboard
    ocr_languages: [en]
    js_wait: 4.0
    interval_minutes: 720
    notify: [telegram]

  - name: "GCF - Mongolia"
    url: "https://www.greenclimate.fund/projects/"
    mode: screenshot
    clip: {x: 0, y: 300, width: 1280, height: 900}    # ← update via dashboard (clip below result count)
    ocr_languages: [en]
    js_wait: 5.0
    interval_minutes: 720
    notify: [telegram]

  - name: "Capital Markets Mongolia"
    url: "https://capitalmarkets.mn/projects?tabValue=energy"
    mode: screenshot
    clip: {x: 0, y: 200, width: 1280, height: 1000}   # ← update via dashboard
    ocr_languages: [en, ru]
    js_wait: 4.0
    interval_minutes: 360
    notify: [telegram]
