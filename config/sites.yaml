  # ── EBRD ─────────────────────────────────────────────────────────────────────
  # Previously used a #fragment URL which requests cannot follow.
  # Now points to the stable project search page for Mongolia energy projects.
  - name: "EBRD - Mongolia Energy"
    url: "https://www.ebrd.com/work-with-us/project-finance/project-summary-documents.html?1=1&filterCountry=Mongolia&filterSector=Energy"
    mode: single_page
    schedule_type: interval
    interval_minutes: 720
    notify:
      - telegram
    min_content_words: 50
    min_change_percent: 2

  # ── EIB ──────────────────────────────────────────────────────────────────────
  # Previously used an unstable pageable query URL.
  # Now points to the stable project search filtered to Mongolia.
  - name: "EIB - Mongolia"
    url: "https://www.eib.org/en/projects/loans/index.htm?q=mongolia&sortColumn=statusDate&sortDir=desc"
    mode: single_page
    schedule_type: interval
    interval_minutes: 720
    notify:
      - telegram
    min_content_words: 50
    min_change_percent: 2

  # ── GCF ──────────────────────────────────────────────────────────────────────
  - name: "GCF - Mongolia"
    url: "https://www.greenclimate.fund/projects/search#mongolia"
    mode: single_page
    schedule_type: interval
    interval_minutes: 720
    javascript: true
    js_wait_seconds: 6
    notify:
      - telegram
    min_change_percent: 2

