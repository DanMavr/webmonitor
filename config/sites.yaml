sites:

  # ── Petromatad ──────────────────────────────────────────────────────────────
  - name: "Petromatad"
    url: "https://www.petromatadgroup.com"
    mode: whole_site
    schedule_type: interval
    interval_minutes: 720
    javascript: true
    js_wait_seconds: 10
    notify:
      - telegram
    crawl:
      use_sitemap: true
      max_pages: 60
      stay_on_domain: true
      exclude_patterns:
        - "/login"
        - "/logout"
        - "/search"
        - "/tag/"
        - "/page/"
        - "/wp-json"
        - "/feed"
        - "/cart"
        - "/account"
        - "/about-us"
        - "/corporate"
        - "/mongolia"
        - "/operations"
        - "/contact"
        - "/blockxx_psc"
        - "/author/"
        - "/category/"
        - ".pdf"
        - ".jpg"
        - ".jpeg"
        - ".png"
        - ".gif"
        - ".zip"
        - ".doc"
        - ".docx"
        - ".xls"
        - ".xlsx"
    min_content_words: 20
    min_change_percent: 1

  # ── LSE RNS ─────────────────────────────────────────────────────────────────
  # URL confirmed correct by user — /analysis page contains the news table
  # 75% of MATD RNS releases historically drop at 07:00-07:05 UK time
  # Window 1: tight 1-minute burst around open to catch the 07:00 drop fast
  # Window 2: full market hours at 5-min intervals for mid-day/close releases
  - name: "LSE - RNS"
    url: "https://www.londonstockexchange.com/stock/MATD/petro-matad-limited/analysis"
    mode: single_page
    schedule_type: time_window
    javascript: true
    js_wait_seconds: 8
    timezone: "Europe/London"
    notify:
      - telegram
    windows:
      - days: mon-fri
        from: "06:55"
        to: "07:10"
        interval_minutes: 1
      - days: mon-fri
        from: "07:10"
        to: "17:00"
        interval_minutes: 5
    min_change_percent: 1
    ignore_selectors:
      - ".timestamp"
      - ".last-updated"
      - ".market-data"
      - ".price-ticker"
      - "[data-testid='time']"
      - "[data-testid='price']"
      - "time"

  # ── Envoi ────────────────────────────────────────────────────────────────────
  - name: "Envoi"
    url: "https://envoi.co.uk/projects/active-projects/asia/mongolia/"
    mode: whole_site
    schedule_type: interval
    interval_minutes: 360
    notify:
      - telegram
    crawl:
      use_sitemap: true
      max_pages: 40
      stay_on_domain: true
      exclude_patterns:
        - "/login"
        - "/search"
        - ".pdf"
        - ".jpg"
        - ".png"
    min_content_words: 50
    min_change_percent: 3

