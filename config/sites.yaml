sites:

  # ── Petromatad ──────────────────────────────────────────────────────────────
  - name: "Petromatad"
    url: "https://www.petromatad.com"
    mode: whole_site
    schedule_type: interval
    interval_minutes: 720
    notify:
      - telegram
    crawl:
      use_sitemap: true
      max_pages: 60
      stay_on_domain: true
      exclude_patterns:
        - "/login"
        - "/logout"
        - "/search"
        - "/tag/"
        - "/page/"
        - "/wp-json"
        - "/feed"
        - "/cart"
        - "/account"
        - ".pdf"
        - ".jpg"
        - ".jpeg"
        - ".png"
        - ".gif"
        - ".zip"
        - ".doc"
        - ".docx"
        - ".xls"
        - ".xlsx"
    min_content_words: 80
    min_change_percent: 3

  # ── LSE RNS ─────────────────────────────────────────────────────────────────
  - name: "LSE - RNS"
    url: "https://www.londonstockexchange.com/stock/MTG/petrogrid/regulatory-news"
    mode: single_page
    schedule_type: time_window
    javascript: true
    js_wait_seconds: 8
    timezone: "Europe/London"
    notify:
      - telegram
    windows:
      - days: mon-fri
        from: "06:59"
        to: "07:10"
        interval_minutes: 5
      - days: sat-sun
        from: "09:00"
        to: "13:00"
        interval_minutes: 30
    min_change_percent: 5
    ignore_selectors:
      - ".timestamp"
      - ".last-updated"
      - ".market-data"
      - ".price-ticker"
      - "[data-testid='time']"
      - "[data-testid='price']"
      - "time"

  # ── Envoi ────────────────────────────────────────────────────────────────────
  - name: "Envoi"
    url: "https://www.envoienergy.com"
    mode: whole_site
    schedule_type: interval
    interval_minutes: 360
    notify:
      - telegram
    crawl:
      use_sitemap: true
      max_pages: 40
      stay_on_domain: true
      exclude_patterns:
        - "/login"
        - "/search"
        - ".pdf"
        - ".jpg"
        - ".png"
    min_content_words: 50
    min_change_percent: 3

  # ── Mongolia Energy Ministry ─────────────────────────────────────────────────
