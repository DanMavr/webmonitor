sites:

  # ── WHOLE WEBSITE MONITORING ──────────────────────────────
  - name: "Petromatad - Full Site"
    url: "https://www.petromatadgroup.com"
    monitor_type: "text"
    mode: "whole_site"
    interval_minutes: 720

    crawl:
      use_sitemap: true
      max_pages: 100
      stay_on_domain: true
      exclude_patterns:
        - "/cdn-cgi/"
        - ".pdf"
        - ".jpg"
        - ".png"

    ignore_selectors:
      - ".stock-price"
      - ".stock-widget"
      - "#live-price"
      - ".ticker"
      - "header"
      - "footer"
      - ".cookie-notice"

    notify:
      - telegram

  # ── SPECIFIC PAGE MONITORING ───────────────────────────────
  - name: "Petromatad - Investor Page"
    url: "https://www.petromatadgroup.com/investors/stock-information/"
    monitor_type: "text"
    mode: "single_page"
    interval_minutes: 60

    watch_selectors:
      - "main"

    ignore_selectors:
      - ".live-price"
      - ".stock-chart"
      - ".price-ticker"

    notify:
      - telegram

# LSE RNS PAGE - time window monitoring
  - name: "LSE - Petro Matad RNS"
    url: "https://www.londonstockexchange.com/stock/MATD/petro-matad-limited/analysis"
    monitor_type: "text"
    mode: "single_page"
    schedule_type: "time_window"
    timezone: "Europe/London"
    windows:
      - days: "mon-fri"
        from: "06:59"
        to: "07:10"
        interval_minutes: 1
      - days: "mon-fri"
        from: "07:10"
        to: "17:00"
        interval_minutes: 5
    notify:
      - telegram
