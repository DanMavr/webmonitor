sites:

  - name: "Petromatad - Full Site"
    url: "https://www.petromatadgroup.com"
    monitor_type: "text"
    mode: "whole_site"
    interval_minutes: 720
    crawl:
      use_sitemap: true
      max_pages: 100
      stay_on_domain: true
      exclude_patterns:
        - "/cdn-cgi/"
        - ".pdf"
        - ".jpg"
        - ".png"
    ignore_selectors:
      - ".stock-price"
      - ".stock-widget"
      - "#live-price"
      - ".ticker"
      - "header"
      - "footer"
      - ".cookie-notice"
    notify:
      - telegram

   - name: "LSE - Petro Matad RNS"
    url: "https://www.londonstockexchange.com/stock/MATD/petro-matad-limited/analysis"
    javascript: true
    js_wait_seconds: 10
    min_change_percent: 5
    monitor_type: "text"
    mode: "single_page"
    schedule_type: "time_window"
    timezone: "Europe/London"
    windows:
      - days: "mon-fri"
        from: "06:59"
        to: "07:10"
        interval_minutes: 1
      - days: "mon-fri"
        from: "07:10"
        to: "17:00"
        interval_minutes: 5
    ignore_selectors:
      - ".price"
      - ".stock-price"
      - ".bid"
      - ".offer"
      - ".change"
      - "header"
      - "footer"
    notify:
      - telegram

  - name: "Envoi - Mongolia Projects"
