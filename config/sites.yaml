  # ── EBRD ─────────────────────────────────────────────────────────────────────
  # Previously used a #fragment URL which requests cannot follow.
  # Now points to the stable project search page for Mongolia energy projects.
  - name: "EBRD - Mongolia Energy"
    url: "https://www.ebrd.com/home/what-we-do/projects.html?1=1&filterCountry=Mongolia&filterSector=Energy#customtab-70eec7766a-item-4654c5d413-tab"
    mode: single_page
    schedule_type: interval
    interval_minutes: 720
    notify:
      - telegram
    min_content_words: 50
    min_change_percent: 2

  # ── EIB ──────────────────────────────────────────────────────────────────────
