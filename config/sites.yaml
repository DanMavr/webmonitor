sites:

  # ── Petromatad ──────────────────────────────────────────────────────────────
  - name: "Petromatad"
    url: "https://www.petromatadgroup.com"
    mode: whole_site
    schedule_type: interval
    interval_minutes: 720
    javascript: true
    js_wait_seconds: 10
    notify:
      - telegram
    crawl:
      use_sitemap: true
      max_pages: 60
      stay_on_domain: true
      exclude_patterns:
        - "/login"
        - "/logout"
        - "/search"
        - "/tag/"
        - "/page/"
        - "/wp-json"
        - "/feed"
        - "/cart"
        - "/account"
        - "/about-us"
        - "/corporate"
        - "/mongolia"
        - "/operations"
        - "/contact"
        - "/blockxx_psc"
        - "/author/"
        - "/category/"
        - ".pdf"
        - ".jpg"
        - ".jpeg"
        - ".png"
        - ".gif"
        - ".zip"
        - ".doc"
        - ".docx"
        - ".xls"
        - ".xlsx"
    min_content_words: 20
    min_change_percent: 1

 # ── LSE RNS ─────────────────────────────────────────────────────────────────
  # Polls the LSE JSON API directly — no Selenium needed.
  # Watches only idnews, subjectnews, datelastnews for clean RNS detection.
  # Checks every 1 minute during market hours mon-fri 06:55-17:00 London time.
  - name: "LSE - RNS"
    url: "https://api.londonstockexchange.com/api/gw/lse/instruments/alldata/MATD"
    mode: json_api
    schedule_type: time_window
    timezone: Europe/London
    notify:
      - telegram
    json_fields:
      - idnews
      - subjectnews
      - datelastnews
    windows:
      - days: mon-fri
        from: '06:55'
        to: '17:00'
        interval_minutes: 1
    min_change_percent: 0.0

  # ── Envoi ────────────────────────────────────────────────────────────────────
  - name: "Envoi"
    url: "https://envoi.co.uk/projects/active-projects/asia/mongolia/"
    mode: single_page
    schedule_type: interval
    interval_minutes: 360
    notify:
      - telegram
    crawl:
      use_sitemap: true
      max_pages: 40
      stay_on_domain: true
      exclude_patterns:
        - "/login"
        - "/search"
        - ".pdf"
        - ".jpg"
        - ".png"
    min_content_words: 50
    min_change_percent: 3

