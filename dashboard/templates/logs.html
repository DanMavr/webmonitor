<!DOCTYPE html>
<html>
<head>
  <title>WebMonitor — Logs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0 }
    body { background: #0f172a; color: #e2e8f0; font-family: system-ui, sans-serif; padding: 32px 24px }
    a.back { color: #38bdf8; font-size: 13px; text-decoration: none; display: inline-block; margin-bottom: 20px }
    h1 { font-size: 18px; font-weight: 700; margin-bottom: 20px; color: #f8fafc }
    table { width: 100%; border-collapse: collapse; font-size: 12px; font-family: monospace }
    th { text-align: left; padding: 8px 12px; color: #64748b; font-size: 11px;
         border-bottom: 1px solid #334155; font-family: system-ui }
    td { padding: 6px 12px; border-bottom: 1px solid #1a2535; vertical-align: top }
    .ts { color: #475569; white-space: nowrap; width: 160px }
    .msg { color: #cbd5e1 }
    .badge { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 10px;
             font-weight: 700; width: 72px; text-align: center; font-family: system-ui }
    .CHANGE   { background:#14532d; color:#86efac }
    .ERROR    { background:#450a0a; color:#f87171 }
    .WARNING  { background:#422006; color:#fdba74 }
    .BASELINE { background:#1e3a5f; color:#7dd3fc }
    .CHECKING { background:#1e293b; color:#94a3b8 }
    .INFO     { background:#1e293b; color:#64748b }
    .cnt { color: #64748b; font-size: 11px }
  </style>
</head>
<body>
  <a href="/" class="back">← Dashboard</a>
  <h1>Activity Log</h1>
  <table>
    <thead><tr><th>Time</th><th>Level</th><th>Message</th></tr></thead>
    <tbody>
    {% for l in lines %}
      <tr>
        <td class="ts">{{ l.ts }}</td>
        <td><span class="badge {{ l.level }}">{{ l.level }}</span></td>
        <td class="msg">
          {{ l.message }}
          {% if l.count > 1 %}<span class="cnt"> ×{{ l.count }}</span>{% endif %}
        </td>
      </tr>
    {% endfor %}
    </tbody>
  </table>
</body>
</html>
